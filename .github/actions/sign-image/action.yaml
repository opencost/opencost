name: 'Sign Container Image'
description: >-
  Sign a multi-platform container image and each of its platform images, and
  attest SLSA v1 build provenance and a per-platform CycloneDX SBOM, using
  cosign keyless (Sigstore) with GitHub Actions OIDC. Callers must check out the
  source tree (e.g. `actions/checkout`) before invoking this action — the
  built commit is resolved with `git rev-parse HEAD` so the attestation
  records the revision that was actually built. The calling job must
  have `id-token: write`.

inputs:
    image:
        description: 'Full image reference (registry/repo:tag) of a multi-platform index to sign by digest.'
        required: true
    workflow-path:
        description: 'Path to the workflow file (repo-relative) that triggered the build.'
        required: true
    run-started-at:
        description: >-
          ISO-8601 workflow run start time (typically
          `github.run_started_at` from the caller workflow). Recorded as
          `runDetails.metadata.startedOn` in the SLSA provenance predicate.
          If empty, the action falls back to the time at which it began
          executing — `github.run_started_at` is reported empty in some
          edge cases and `required: true` on a composite-action input
          does not reject empty strings.
        required: true

runs:
    using: "composite"
    steps:
      - name: Capture fallback start timestamp
        id: start
        shell: bash
        run: |
          echo "STARTED_ON=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.3
        with:
          cosign-release: 'v3.1.4'

      - name: Install crane
        uses: imjasonh/setup-crane@v0.7

      - name: Install trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.76.2

      - name: Resolve image digests
        id: digest
        shell: bash
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          DIGEST="$(crane digest "${IMAGE}")"
          REPO="${IMAGE%:*}"
          REF="${REPO}@${DIGEST}"
          echo "Resolved ${IMAGE} -> ${REF}"

          # One "os/arch[/variant] digest" line per platform image in the index.
          PLATFORMS="${RUNNER_TEMP}/platforms.txt"
          crane manifest "${REF}" | jq -r '.manifests[]?
            | select(.platform.os != "unknown")
            | "\(.platform.os)/\(.platform.architecture)\(if .platform.variant then "/" + .platform.variant else "" end) \(.digest)"' > "${PLATFORMS}"
          if [[ ! -s "${PLATFORMS}" ]]; then
            echo "::error::${REF} is not a multi-platform index"
            exit 1
          fi
          cat "${PLATFORMS}"

          echo "REF=${REF}" >> "$GITHUB_OUTPUT"
          echo "REPO=${REPO}" >> "$GITHUB_OUTPUT"
          echo "DIGEST=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "PLATFORMS=${PLATFORMS}" >> "$GITHUB_OUTPUT"

      # Everything is signed and attested twice: as Sigstore bundles via OCI referrers (cosign v3
      # default), and in the legacy .sig/.att tag format that cosign v2 clients, existing admission
      # policies and tag-only mirrors read. Drop LEGACY_FORMAT once consumers have moved to bundles.
      - name: Sign image and platform images with cosign (keyless)
        shell: bash
        env:
          REF: ${{ steps.digest.outputs.REF }}
          LEGACY_FORMAT: --new-bundle-format=false --use-signing-config=false
        run: |
          set -euo pipefail
          cosign sign --yes --recursive "${REF}"
          cosign sign --yes --recursive ${LEGACY_FORMAT} "${REF}"

      - name: Generate SLSA v1 provenance predicate
        shell: bash
        env:
          WORKFLOW_PATH: ${{ inputs.workflow-path }}
          STARTED_ON: ${{ inputs.run-started-at }}
          FALLBACK_STARTED_ON: ${{ steps.start.outputs.STARTED_ON }}
        run: |
          set -euo pipefail
          if [[ -z "${STARTED_ON:-}" ]]; then
            echo "inputs.run-started-at is empty; using fallback ${FALLBACK_STARTED_ON}"
            STARTED_ON="$FALLBACK_STARTED_ON"
          fi
          if [[ -z "${STARTED_ON:-}" ]]; then
            echo "::error::startedOn resolved empty after fallback; predicate would be unparseable"
            exit 1
          fi
          echo "Using startedOn=${STARTED_ON}"
          RESOLVED_GIT_COMMIT="$(git rev-parse HEAD)"
          export RESOLVED_GIT_COMMIT STARTED_ON
          python3 - <<'PY' > predicate.json
          import json
          import os

          repo = os.environ["GITHUB_REPOSITORY"]
          commit = os.environ["RESOLVED_GIT_COMMIT"]
          run_id = os.environ["GITHUB_RUN_ID"]
          run_attempt = os.environ["GITHUB_RUN_ATTEMPT"]

          predicate = {
              "buildDefinition": {
                  "buildType": "https://github.com/opencost/opencost/build/workflow@v1",
                  "externalParameters": {
                      "workflow": {
                          "ref": os.environ["GITHUB_REF"],
                          "repository": f"https://github.com/{repo}",
                          "path": os.environ["WORKFLOW_PATH"],
                      }
                  },
                  "internalParameters": {},
                  "resolvedDependencies": [
                      {
                          "uri": f"git+https://github.com/{repo}@{commit}",
                          "digest": {"gitCommit": commit},
                      }
                  ],
              },
              "runDetails": {
                  "builder": {
                      "id": f"https://github.com/{repo}/actions/runs/{run_id}",
                  },
                  "metadata": {
                      "invocationId": f"https://github.com/{repo}/actions/runs/{run_id}/attempts/{run_attempt}",
                      "startedOn": os.environ["STARTED_ON"],
                  },
              },
          }
          print(json.dumps(predicate, indent=2))
          PY

      # `cosign attest` has no --recursive, so each platform image is attested on its own.
      # The loops read the list on fd 3 so cosign and trivy can't consume it from stdin.
      - name: Attest SLSA provenance with cosign
        shell: bash
        env:
          REF: ${{ steps.digest.outputs.REF }}
          REPO: ${{ steps.digest.outputs.REPO }}
          PLATFORMS: ${{ steps.digest.outputs.PLATFORMS }}
          LEGACY_FORMAT: --new-bundle-format=false --use-signing-config=false
        run: |
          set -euo pipefail
          attest() {
            cosign attest --yes --predicate predicate.json --type slsaprovenance1 "$1"
            cosign attest --yes --predicate predicate.json --type slsaprovenance1 ${LEGACY_FORMAT} "$1"
          }
          attest "${REF}"
          while read -r -u 3 _ digest; do
            attest "${REPO}@${digest}"
          done 3< "${PLATFORMS}"

      - name: Attest per-platform CycloneDX SBOMs with cosign
        shell: bash
        env:
          REF: ${{ steps.digest.outputs.REF }}
          REPO: ${{ steps.digest.outputs.REPO }}
          PLATFORMS: ${{ steps.digest.outputs.PLATFORMS }}
          LEGACY_FORMAT: --new-bundle-format=false --use-signing-config=false
        run: |
          set -euo pipefail
          while read -r -u 3 platform digest; do
            sbom="${RUNNER_TEMP}/sbom-${digest#sha256:}.cdx.json"
            trivy image --quiet --platform "${platform}" --format cyclonedx --output "${sbom}" "${REF}"
            cosign attest --yes --predicate "${sbom}" --type cyclonedx "${REPO}@${digest}"
            cosign attest --yes --predicate "${sbom}" --type cyclonedx ${LEGACY_FORMAT} "${REPO}@${digest}"
          done 3< "${PLATFORMS}"
