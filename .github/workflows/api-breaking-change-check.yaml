name: API Breaking Change Check

# Runs only when docs/swagger.json is modified in a PR targeting develop,
# or when the merge queue requests a check.
on:
  pull_request:
    branches:
      - develop
    paths:
      - "docs/swagger.json"
  # merge_group does not support paths: filtering, so we guard inside the job
  # with a changed-files check instead of running unconditionally.
  merge_group:
    types: [checks_requested]

# Minimal permissions: read repo content, write PR comments.
permissions:
  contents: read
  pull-requests: write

jobs:
  api-breaking-change-check:
    name: Detect Breaking API Changes
    runs-on: ubuntu-latest
    # Prevent a hung curl/oasdiff from blocking a runner indefinitely.
    timeout-minutes: 10

    steps:
      # ------------------------------------------------------------------ #
      # 1. Shallow checkout — we only need the working tree + enough        #
      #    history to resolve the base ref tip (fetched in step 2).         #
      # ------------------------------------------------------------------ #
      - name: Checkout PR branch
        uses: actions/checkout@v6.0.2
        with:
          # depth=1 is enough; we fetch the base ref separately below.
          fetch-depth: 1

      # ------------------------------------------------------------------ #
      # 2. For merge_group events, check whether swagger.json actually      #
      #    changed. If not, skip all remaining steps gracefully.            #
      # ------------------------------------------------------------------ #
      - name: Check if swagger.json changed (merge_group only)
        id: changed
        if: github.event_name == 'merge_group'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1 2>/dev/null || \
          git fetch origin HEAD~1 --depth=1 2>/dev/null || true

          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q "docs/swagger.json"; then
            echo "swagger_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "swagger_changed=false" >> "$GITHUB_OUTPUT"
            echo "docs/swagger.json not changed in this merge group entry — skipping."
          fi

      # ------------------------------------------------------------------ #
      # 3. Extract the base-branch version of swagger.json                 #
      # ------------------------------------------------------------------ #
      - name: Extract base swagger.json
        if: github.event_name == 'pull_request' || steps.changed.outputs.swagger_changed == 'true'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git show origin/${{ github.base_ref }}:docs/swagger.json \
            > /tmp/swagger-base.json
          echo "Base spec extracted from origin/${{ github.base_ref }}"

          # Validate the base spec is parseable JSON before diffing.
          python3 -c "import json,sys; json.load(open('/tmp/swagger-base.json'))" \
            || { echo "ERROR: base swagger.json is not valid JSON"; exit 1; }

      # ------------------------------------------------------------------ #
      # 4. Validate and copy the PR version of swagger.json                #
      # ------------------------------------------------------------------ #
      - name: Validate and copy PR swagger.json
        if: github.event_name == 'pull_request' || steps.changed.outputs.swagger_changed == 'true'
        run: |
          # Fail fast if the PR spec itself is malformed JSON.
          python3 -c "import json,sys; json.load(open('docs/swagger.json'))" \
            || { echo "ERROR: PR docs/swagger.json is not valid JSON"; exit 1; }

          cp docs/swagger.json /tmp/swagger-pr.json
          echo "PR spec validated and copied"

      # ------------------------------------------------------------------ #
      # 5. Install oasdiff at a pinned version for reproducibility.        #
      #    https://github.com/Tufin/oasdiff/releases                       #
      # ------------------------------------------------------------------ #
      - name: Install oasdiff
        if: github.event_name == 'pull_request' || steps.changed.outputs.swagger_changed == 'true'
        env:
          OASDIFF_VERSION: "1.10.24"
        run: |
          curl -sSfL \
            "https://github.com/Tufin/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/oasdiff.tar.gz
          tar -xzf /tmp/oasdiff.tar.gz -C /tmp oasdiff
          sudo mv /tmp/oasdiff /usr/local/bin/oasdiff
          oasdiff --version

      # ------------------------------------------------------------------ #
      # 6. Run breaking-change detection.                                  #
      #    oasdiff exit codes:                                              #
      #      0 = no breaking changes                                        #
      #      1 = breaking changes found                                     #
      #     >1 = tool error (bad input, internal error)                     #
      #    We distinguish tool errors from actual breaking changes so we    #
      #    don't report a malformed spec as "breaking changes".             #
      # ------------------------------------------------------------------ #
      - name: Check for breaking changes
        id: breaking
        if: github.event_name == 'pull_request' || steps.changed.outputs.swagger_changed == 'true'
        run: |
          set +e
          oasdiff breaking \
            /tmp/swagger-base.json \
            /tmp/swagger-pr.json \
            --format text \
            > /tmp/breaking-report.txt 2>/tmp/breaking-error.txt
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -gt 1 ]; then
            echo "ERROR: oasdiff exited with code ${EXIT_CODE} (tool error):"
            cat /tmp/breaking-error.txt
            echo "has_breaking=false"  >> "$GITHUB_OUTPUT"
            echo "tool_error=true"     >> "$GITHUB_OUTPUT"
            exit $EXIT_CODE
          fi

          echo "has_breaking=$([ $EXIT_CODE -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "tool_error=false" >> "$GITHUB_OUTPUT"

          echo "---------- Breaking Change Report ----------"
          cat /tmp/breaking-report.txt
          echo "-------------------------------------------"

      # ------------------------------------------------------------------ #
      # 7. Generate a full changelog (non-breaking + breaking).            #
      # ------------------------------------------------------------------ #
      - name: Generate full API changelog
        if: >-
          always() &&
          (github.event_name == 'pull_request' || steps.changed.outputs.swagger_changed == 'true')
        run: |
          oasdiff changelog \
            /tmp/swagger-base.json \
            /tmp/swagger-pr.json \
            --format text \
            > /tmp/changelog.txt 2>&1 || true

          echo "---------- Full API Changelog ----------"
          cat /tmp/changelog.txt
          echo "----------------------------------------"

      # ------------------------------------------------------------------ #
      # 8. Upload both reports as downloadable artifacts for reviewers.    #
      # ------------------------------------------------------------------ #
      - name: Upload diff reports
        if: >-
          always() &&
          (github.event_name == 'pull_request' || steps.changed.outputs.swagger_changed == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: api-diff-reports
          path: |
            /tmp/breaking-report.txt
            /tmp/changelog.txt
          retention-days: 30

      # ------------------------------------------------------------------ #
      # 9. Post (or update) a PR comment with the full report.             #
      #    Replaces any previous comment from this workflow to avoid spam.  #
      # ------------------------------------------------------------------ #
      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const hasBreaking  = '${{ steps.breaking.outputs.has_breaking }}' === 'true';
            const toolError    = '${{ steps.breaking.outputs.tool_error }}'   === 'true';

            // Read report files, fall back gracefully if missing.
            const readFile = (p) => {
              try { return fs.readFileSync(p, 'utf8').trim(); }
              catch { return ''; }
            };
            const breakingReport = readFile('/tmp/breaking-report.txt');
            const changelog      = readFile('/tmp/changelog.txt');

            // Build comment body.
            let icon, statusLine;
            if (toolError) {
              icon       = '⚠️';
              statusLine = '**oasdiff encountered an error** — could not complete the diff. Check the workflow logs.';
            } else if (hasBreaking) {
              icon       = '🚨';
              statusLine = '**Breaking changes detected** — this PR modifies the OpenCost API in a backward-incompatible way.';
            } else {
              icon       = '✅';
              statusLine = '**No breaking changes** — this PR is backward-compatible.';
            }

            const parts = [
              `## ${icon} API Breaking Change Check`,
              '',
              statusLine,
            ];

            if (hasBreaking && !toolError) {
              parts.push(
                '',
                '> **To override:** If this breaking change is intentional, add the label',
                '> `api-breaking-change-approved` to this PR and re-run the check.',
                '> Also bump `info.version` in `docs/swagger.json`.',
              );
            }

            if (hasBreaking && breakingReport) {
              parts.push('', '### Breaking Changes', '```', breakingReport, '```');
            }

            if (changelog) {
              parts.push(
                '',
                '<details>',
                '<summary>Full API Changelog</summary>',
                '',
                '```',
                changelog,
                '```',
                '</details>',
              );
            }

            const baseRef = context.payload.pull_request.base.ref;
            const headRef = context.payload.pull_request.head.ref;
            parts.push(
              '',
              `_Powered by [oasdiff](https://github.com/Tufin/oasdiff) · \`${baseRef}\` ← \`${headRef}\`_`,
            );

            const body = parts.join('\n');

            // Delete any previous comment from this workflow to avoid spam.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const c of comments) {
              if (
                c.user.login === 'github-actions[bot]' &&
                c.body.includes('API Breaking Change Check')
              ) {
                await github.rest.issues.deleteComment({
                  owner:      context.repo.owner,
                  repo:       context.repo.repo,
                  comment_id: c.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      # ------------------------------------------------------------------ #
      # 10. Check for the intentional-override label.                      #
      #     Only evaluated when breaking changes were actually found.       #
      # ------------------------------------------------------------------ #
      - name: Check for override label
        id: override
        if: steps.breaking.outputs.has_breaking == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('approved', 'false');
              return;
            }
            const labels   = context.payload.pull_request.labels.map(l => l.name);
            const approved = labels.includes('api-breaking-change-approved');
            core.setOutput('approved', String(approved));
            if (approved) {
              core.warning(
                'Breaking changes approved via label "api-breaking-change-approved". ' +
                'Ensure this is intentional and info.version in swagger.json has been bumped.'
              );
            }

      # ------------------------------------------------------------------ #
      # 11. Fail the job when breaking changes exist and no override label. #
      #     Step 10 is only reached when has_breaking == true, so          #
      #     steps.override.outputs.approved is always set here.            #
      # ------------------------------------------------------------------ #
      - name: Fail on unapproved breaking changes
        if: >-
          steps.breaking.outputs.has_breaking == 'true' &&
          steps.override.outputs.approved != 'true'
        run: |
          echo ""
          echo "##########################################################"
          echo "#  BREAKING API CHANGES DETECTED                        #"
          echo "#                                                        #"
          echo "#  This PR modifies docs/swagger.json in a way that     #"
          echo "#  breaks backward compatibility.                        #"
          echo "#                                                        #"
          echo "#  Options:                                              #"
          echo "#  1. Refactor the change to be backward-compatible.    #"
          echo "#  2. If intentional:                                   #"
          echo "#     a) Add label 'api-breaking-change-approved'       #"
          echo "#     b) Bump info.version in docs/swagger.json         #"
          echo "#     c) Re-run this check                              #"
          echo "##########################################################"
          echo ""
          cat /tmp/breaking-report.txt
          exit 1
