name: Debug Sign Predicate

# Temporary workflow for validating the run-started-at fallback in
# .github/actions/sign-image/action.yaml. Two layers of validation:
#   1. Bash/Python predicate generation (matrix: empty + populated inputs).
#   2. Real cosign attest with --no-upload — exercises cosign's actual
#      predicate unmarshal (the code path that originally failed). Cosign
#      2.5.x has no working CLI to skip the transparency log, so each
#      matrix leg produces a public Rekor entry on the fork's identity.
# Delete this file before opening the real PR.

on:
  push:
    branches:
      - cdp/sign-image-debug

permissions:
  contents: read
  id-token: write
  packages: read

jobs:
  generate-predicate:
    name: generate-predicate (${{ matrix.case_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case_name: empty-input-uses-fallback
            started_on: ''
          - case_name: populated-input
            started_on: '2026-05-18T12:00:00Z'
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Capture fallback start timestamp
        id: start
        shell: bash
        run: |
          echo "STARTED_ON=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Generate predicate (mirrors sign-image action logic)
        shell: bash
        env:
          WORKFLOW_PATH: .github/workflows/debug-sign-predicate.yml
          STARTED_ON: ${{ matrix.started_on }}
          FALLBACK_STARTED_ON: ${{ steps.start.outputs.STARTED_ON }}
        run: |
          set -euo pipefail
          if [[ -z "${STARTED_ON:-}" ]]; then
            echo "STARTED_ON is empty; using fallback ${FALLBACK_STARTED_ON}"
            STARTED_ON="$FALLBACK_STARTED_ON"
          fi
          if [[ -z "${STARTED_ON:-}" ]]; then
            echo "::error::startedOn resolved empty after fallback; predicate would be unparseable"
            exit 1
          fi
          echo "Using startedOn=${STARTED_ON}"
          RESOLVED_GIT_COMMIT="$(git rev-parse HEAD)"
          export RESOLVED_GIT_COMMIT STARTED_ON
          python3 - <<'PY' > predicate.json
          import json
          import os

          repo = os.environ["GITHUB_REPOSITORY"]
          commit = os.environ["RESOLVED_GIT_COMMIT"]
          run_id = os.environ["GITHUB_RUN_ID"]
          run_attempt = os.environ["GITHUB_RUN_ATTEMPT"]

          predicate = {
              "buildDefinition": {
                  "buildType": "https://github.com/opencost/opencost/build/workflow@v1",
                  "externalParameters": {
                      "workflow": {
                          "ref": os.environ["GITHUB_REF"],
                          "repository": f"https://github.com/{repo}",
                          "path": os.environ["WORKFLOW_PATH"],
                      }
                  },
                  "internalParameters": {},
                  "resolvedDependencies": [
                      {
                          "uri": f"git+https://github.com/{repo}@{commit}",
                          "digest": {"gitCommit": commit},
                      }
                  ],
              },
              "runDetails": {
                  "builder": {
                      "id": f"https://github.com/{repo}/actions/runs/{run_id}",
                  },
                  "metadata": {
                      "invocationId": f"https://github.com/{repo}/actions/runs/{run_id}/attempts/{run_attempt}",
                      "startedOn": os.environ["STARTED_ON"],
                  },
              },
          }
          print(json.dumps(predicate, indent=2))
          PY

      - name: Dump and validate predicate (RFC3339 proxy)
        shell: bash
        env:
          EXPECT_STARTED_ON: ${{ matrix.started_on }}
        run: |
          set -euo pipefail
          echo "--- predicate.json ---"
          cat predicate.json
          echo "--- validation ---"
          python3 - <<'PY'
          import json, os, sys
          from datetime import datetime

          d = json.load(open("predicate.json"))
          got = d["runDetails"]["metadata"]["startedOn"]
          expected = os.environ.get("EXPECT_STARTED_ON", "")

          print(f"got startedOn={got!r}")
          print(f"expected (input)={expected!r}")

          if not got:
              print("FAIL: startedOn is empty after fallback")
              sys.exit(1)

          # When input was empty, the fallback (action start time) is used.
          # When input was populated, predicate must echo it verbatim.
          if expected and got != expected:
              print(f"FAIL: populated input was not passed through")
              sys.exit(1)

          # Validate RFC3339-ish (Python <3.11 needs the Z swap).
          datetime.fromisoformat(got.replace("Z", "+00:00"))
          print("OK: startedOn present and parses as RFC3339")
          PY

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Validate predicate via real cosign attest
        shell: bash
        run: |
          set -euo pipefail
          # NOTE: cosign 2.5.x rejects --tlog-upload=false and has no working
          # CLI to bypass the signing config, so this WILL produce a Rekor
          # transparency-log entry per matrix leg. Acceptable cost for the
          # real unmarshal-path coverage; delete this step or the workflow
          # before merging if you want to stop emitting test entries.
          cosign attest --yes --no-upload \
            --predicate predicate.json \
            --type slsaprovenance1 \
            ghcr.io/opencost/opencost:latest > /dev/null
          echo "OK: cosign attest accepted predicate (case=${{ matrix.case_name }})"
