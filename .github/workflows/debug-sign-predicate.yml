name: Debug Sign Predicate

# Temporary workflow for validating the run-started-at fallback in
# .github/actions/sign-image/action.yaml without invoking cosign. Trigger
# manually from the Actions tab and exercise both the empty-input path
# (fallback) and the populated-input path. Delete before merging.

on:
  workflow_dispatch:
    inputs:
      run-started-at:
        description: 'ISO-8601 start time (leave empty to exercise the fallback)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  generate-predicate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Capture fallback start timestamp
        id: start
        shell: bash
        run: |
          echo "STARTED_ON=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Generate predicate (mirrors sign-image action logic)
        shell: bash
        env:
          WORKFLOW_PATH: .github/workflows/debug-sign-predicate.yml
          STARTED_ON: ${{ inputs.run-started-at }}
          FALLBACK_STARTED_ON: ${{ steps.start.outputs.STARTED_ON }}
        run: |
          set -euo pipefail
          if [[ -z "${STARTED_ON:-}" ]]; then
            echo "inputs.run-started-at is empty; using fallback ${FALLBACK_STARTED_ON}"
            STARTED_ON="$FALLBACK_STARTED_ON"
          fi
          if [[ -z "${STARTED_ON:-}" ]]; then
            echo "::error::startedOn resolved empty after fallback; predicate would be unparseable"
            exit 1
          fi
          echo "Using startedOn=${STARTED_ON}"
          RESOLVED_GIT_COMMIT="$(git rev-parse HEAD)"
          export RESOLVED_GIT_COMMIT STARTED_ON
          python3 - <<'PY' > predicate.json
          import json
          import os

          repo = os.environ["GITHUB_REPOSITORY"]
          commit = os.environ["RESOLVED_GIT_COMMIT"]
          run_id = os.environ["GITHUB_RUN_ID"]
          run_attempt = os.environ["GITHUB_RUN_ATTEMPT"]

          predicate = {
              "buildDefinition": {
                  "buildType": "https://github.com/opencost/opencost/build/workflow@v1",
                  "externalParameters": {
                      "workflow": {
                          "ref": os.environ["GITHUB_REF"],
                          "repository": f"https://github.com/{repo}",
                          "path": os.environ["WORKFLOW_PATH"],
                      }
                  },
                  "internalParameters": {},
                  "resolvedDependencies": [
                      {
                          "uri": f"git+https://github.com/{repo}@{commit}",
                          "digest": {"gitCommit": commit},
                      }
                  ],
              },
              "runDetails": {
                  "builder": {
                      "id": f"https://github.com/{repo}/actions/runs/{run_id}",
                  },
                  "metadata": {
                      "invocationId": f"https://github.com/{repo}/actions/runs/{run_id}/attempts/{run_attempt}",
                      "startedOn": os.environ["STARTED_ON"],
                  },
              },
          }
          print(json.dumps(predicate, indent=2))
          PY

      - name: Dump and validate predicate
        shell: bash
        run: |
          set -euo pipefail
          echo "--- predicate.json ---"
          cat predicate.json
          echo "--- validation ---"
          python3 - <<'PY'
          import json, sys
          from datetime import datetime
          d = json.load(open("predicate.json"))
          s = d["runDetails"]["metadata"]["startedOn"]
          print(f"startedOn={s!r}")
          if not s:
              print("FAIL: startedOn is empty")
              sys.exit(1)
          # cosign parses with Go's RFC3339; Python's fromisoformat handles
          # the trailing 'Z' from 3.11+, so this is a close-enough proxy.
          datetime.fromisoformat(s.replace("Z", "+00:00"))
          print("OK: startedOn is set and parses as RFC3339")
          PY
