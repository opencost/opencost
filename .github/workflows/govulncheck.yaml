name: govulncheck

permissions: {}

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  merge_group:
    types: [checks_requested]
  schedule:
    # New advisories land without code changes; scan develop weekly.
    - cron: '0 6 * * 1'

env:
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - core
          - modules/prometheus-source
          - modules/collector-source
          - modules/pricing/basic
          - modules/pricing/public
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 'stable'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}

      - name: Generate SARIF report
        working-directory: ${{ matrix.module }}
        run: govulncheck -format sarif ./... > "${GITHUB_WORKSPACE}/govulncheck.sarif"

      - name: Upload SARIF to GitHub Security tab
        if: always() && hashFiles('govulncheck.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck-${{ matrix.module }}

      - name: Run govulncheck
        # Fails only when a vulnerable symbol is reachable from our code.
        working-directory: ${{ matrix.module }}
        run: govulncheck ./...
