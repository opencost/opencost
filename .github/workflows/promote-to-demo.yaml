name: Promote to Demo

# Privileged trigger: workflow_run is restricted to runs from this repository; see the job-level if.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [Build and Publish Develop]
    types: [completed]
    branches: [develop]

concurrency:
  group: build-opencost-develop
  cancel-in-progress: false

permissions: {}
jobs:
  prep-image-name:
    runs-on: ubuntu-latest
    # See build-and-publish-develop.yml: only promote builds of pushes to this repo.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.tags.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set SHA
        id: sha
        run: |
          echo "OC_SHORTHASH=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set OpenCost Image Tags
        id: tags
        env:
          REPO_OWNER: ${{ github.repository_owner }} 
          OC_SHORTHASH: ${{ steps.sha.outputs.OC_SHORTHASH }}
        run: |
          echo "IMAGE_TAG=ghcr.io/$REPO_OWNER/opencost:develop-$OC_SHORTHASH" >> $GITHUB_OUTPUT
 
  install-on-demo:
    needs: [prep-image-name]
    uses: opencost/opencost-infra/.github/workflows/promote-to-oc-demo.yaml@main # zizmor: ignore[secrets-inherit] opencost-infra workflows do not declare their secrets yet
    secrets: inherit
    with:
      img-fqdn: ${{ needs.prep-image-name.outputs.image_tag }}
      is_be: true