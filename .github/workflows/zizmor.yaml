name: zizmor

# Static analysis of GitHub Actions workflows (https://docs.zizmor.sh): catches
# unpinned actions, template injection, dangerous triggers, excessive
# permissions and credential persistence before they merge.

permissions: {}

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  merge_group:
    types: [checks_requested]

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          config: .github/zizmor.yml
          min-severity: low
          # Fail the job on findings instead of uploading to code scanning.
          advanced-security: false
          annotations: true
