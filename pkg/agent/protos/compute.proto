syntax = "proto3";

import "common.proto";
import "costs.proto";

package agent;
option go_package = "github.com/opencost/opencost/pkg/agent/model/pb;pb";

// GPUDevice represents a GPU device with DCGM integration (provisioned resource)
message GPUDevice {
  // Identification
  string ID = 1;          // NVIDIA GPU UUID (hardware identifier)
  string NodeID = 2;

  // Properties
  int32 DeviceNumber = 3;
  string ModelName = 4;
  map<string, string> Labels = 5;
  map<string, string> Annotations = 6;

  // Resource lifecycle (only when different from cluster window)
  ResourceLifetime lifetime = 7;

  // Data (usage metrics available from DCGM)
  float UsageAvg = 8;
  float UsageMax = 9;

  // GPU sharing information (needed for cost allocation)
  bool isShared = 12;
  float sharePercentage = 13;

  // GPU cost data (optional - only populated for cost-enabled exports)
  AllocationCost cost = 10;

  // Cost attribution for this GPU device
  CostAttribution costAttribution = 11;
}