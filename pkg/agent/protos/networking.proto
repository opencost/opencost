syntax = "proto3";

import "common.proto";
import "costs.proto";

package agent;
option go_package = "github.com/opencost/opencost/pkg/agent/model/pb;pb";

// LoadBalancer represents a cloud load balancer (provisioned resource)
message LoadBalancer {
  // Identification
  string ID = 1;
  string ServiceID = 2;  // References the Service that exposes this LoadBalancer

  // Properties
  string Name = 3;
  map<string, string> Labels = 4;
  map<string, string> Annotations = 5;

  // Resource lifecycle (only when different from cluster window)
  ResourceLifetime lifetime = 6;

  // Load balancer cost data (optional - only populated for cost-enabled exports)
  AllocationCost cost = 7;

  // Cost attribution for this load balancer
  CostAttribution costAttribution = 8;
}

// ServicePort represents a port exposed by a service
message ServicePort {
  string Name = 1;
  string Protocol = 2;
  int32 Port = 3;
  int32 TargetPort = 4;
  int32 NodePort = 5;
}

// Service represents a K8s Service (allocated resource)
message Service {
  // Identification
  string ID = 1;
  string NamespaceID = 2;

  // Properties
  string Name = 3;
  string ServiceType = 4;
  map<string, string> Labels = 5;
  map<string, string> Annotations = 6;

  // Resource lifecycle (only when different from cluster window)
  ResourceLifetime lifetime = 7;

  // Service-level aggregated cost data (optional - only populated for cost-enabled exports)
  AllocationCost cost = 8;

  // Cost attribution for this service
  CostAttribution costAttribution = 9;
}