syntax = "proto3";

import "common.proto";
import "costs.proto";

package agent;
option go_package = "github.com/opencost/opencost/pkg/agent/model/pb;pb";

// Volume represents a persistent volume (provisioned resource)
message Volume {
  // Identification
  string ID = 1;

  // Properties
  string Name = 2;
  string StorageClass = 3;
  map<string, string> Labels = 4;
  map<string, string> Annotations = 5;

  // Resource lifecycle (only when different from cluster window)
  ResourceLifetime lifetime = 6;

  // Storage cost data (optional - only populated for cost-enabled exports)
  AllocationCost cost = 7;

  // Cost attribution for this volume
  CostAttribution cost_attribution = 8;
}

// PersistentVolumeClaim represents a PVC (allocated resource) that refers to a Volume
message PersistentVolumeClaim {
  // Identification
  string ID = 1;
  string VolumeID = 2;
  string PodID = 3;
  string NamespaceID = 4;

  // Properties
  string Name = 5;
  string StorageClass = 6;
  map<string, string> Labels = 7;
  map<string, string> Annotations = 8;

  // Resource lifecycle (only when different from cluster window)
  ResourceLifetime lifetime = 9;

  // Storage allocation cost data (optional - only populated for cost-enabled exports)
  AllocationCost cost = 10;

  // Cost attribution for this PVC
  CostAttribution cost_attribution = 11;
}