syntax = "proto3";

import "common.proto";
import "costs.proto";

package agent;
option go_package = "github.com/opencost/opencost/pkg/agent/model/pb;pb";

// Namespace represents a Kubernetes namespace (allocated resource grouping)
message Namespace {
  // Identification
  string ID = 1;

  // Properties
  string Name = 2;
  map<string, string> Labels = 3;
  map<string, string> Annotations = 4;

  // Resource lifecycle (only when different from cluster window)
  ResourceLifetime lifetime = 5;

  // Namespace-level aggregated cost data (optional - only populated for cost-enabled exports)
  AllocationCost cost = 6;

  // Cost attribution for this namespace
  CostAttribution costAttribution = 7;
}