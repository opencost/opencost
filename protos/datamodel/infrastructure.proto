syntax = "proto3";

import "datamodel/common.proto";
import "datamodel/costs.proto";
import "datamodel/nodes.proto";
import "datamodel/compute.proto";
import "datamodel/storage.proto";
import "datamodel/networking.proto";
import "datamodel/pods.proto";
import "datamodel/workloads.proto";

package datamodel.v2;
option go_package = "github.com/opencost/opencost/core/pkg/model/pb;pb";

// Cluster represents the top-level container following normalized approach
// To serve as a wrapper for all resource collections
message Cluster {
  // Identification
  string ID = 1;

  // Properties
  Provider Provider = 2;
  string Account = 3;
  string Project = 4;
  string Region = 5;
  string Name = 6;

  // Centralized window definition for entire cluster
  // All resources inherit this window unless they specify resource_window override
  TimeWindow window = 7;

  // Data
  float ManagementFeePerHour = 8;

  // Collection wrapper: All resource types contained within this cluster
  repeated Node Nodes = 9;
  repeated GPUDevice GPUDevices = 10;
  repeated Volume Volumes = 11;
  repeated LoadBalancer LoadBalancers = 12;
  repeated Service Services = 13;
  repeated PersistentVolumeClaim PVCs = 14;
  repeated Namespace Namespaces = 15;
  repeated Pod Pods = 16;
  repeated Container Containers = 17;

  // Cost data collections (optional - only populated for cost-enabled exports)
  // Shared costs that need distribution across multiple resources
  repeated SharedCostAllocation sharedCosts = 18;

  // External cloud service costs not directly tied to K8s resources
  repeated ExternalCostAllocation externalCosts = 19;

  // Cluster-level aggregated cost data (sum of all resource costs + shared + external)
  AllocationCost totalCost = 20;

  // Cost attribution for this cluster
  CostAttribution costAttribution = 21;
}