syntax = "proto3";

import "datamodel/common.proto";
import "datamodel/costs.proto";

package datamodel.v2;
option go_package = "github.com/opencost/opencost/core/pkg/model/pb;pb";

// Node represents a Kubernetes worker node (provisioned resource)
message Node {
  // Identification
  string ID = 1;
  string ProviderResourceID = 2;

  // Properties
  string Name = 3;
  map<string, string> Labels = 4;
  map<string, string> Annotations = 5;

  // Resource lifecycle (only when different from cluster window)
  ResourceLifetime lifetime = 6;

  // Infrastructure cost data (optional - only populated for cost-enabled exports)
  AllocationCost cost = 7;

  // Cost attribution for this node
  CostAttribution costAttribution = 8;
}