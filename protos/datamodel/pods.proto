syntax = "proto3";

import "datamodel/common.proto";
import "datamodel/costs.proto";

package datamodel.v2;
option go_package = "github.com/opencost/opencost/core/pkg/model/pb;pb";

// Pod represents a Kubernetes pod (allocated resource grouping)
message Pod {
  // Identification
  string ID = 1;
  string NodeID = 2;
  string NamespaceID = 3;

  // Properties
  string Name = 4;
  map<string, string> Labels = 5;
  map<string, string> Annotations = 6;

  // Resource lifecycle (only when different from cluster window)
  ResourceLifetime lifetime = 7;

  // Cost allocation data (optional - only populated for cost-enabled exports)
  AllocationCost cost = 8;

  // Cost attribution for this pod
  CostAttribution costAttribution = 9;
}

// Container represents a container within a pod (allocated resource)
message Container {
  // Identification
  string ID = 1; //{pod-uid}/{container-name}
  string PodID = 2;

  // Properties
  string Name = 3;

  // Resource lifecycle (only when different from cluster window)
  ResourceLifetime lifetime = 4;

  // Cost allocation data (optional - only populated for cost-enabled exports)
  AllocationCost cost = 5;

  // Cost attribution for this container
  CostAttribution costAttribution = 6;
}