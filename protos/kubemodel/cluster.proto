syntax = "proto3";

import "model/window.proto";
import "kubemodel/container.proto";
import "kubemodel/controller.proto";
import "kubemodel/gpu.proto";
import "kubemodel/namespace.proto";
import "kubemodel/network.proto";
import "kubemodel/node.proto";
import "kubemodel/pod.proto";
import "kubemodel/storage.proto";

package kubemodel;
option go_package = "github.com/opencost/opencost/core/pkg/model/pb/kubemodel";

// Provider represents the cloud provider or infrastructure type
enum Provider {
  PROVIDER_UNSPECIFIED = 0;
  PROVIDER_AWS = 1;
  PROVIDER_GCP = 2;
  PROVIDER_AZURE = 3;
  PROVIDER_ON_PREMISES = 4;
  PROVIDER_ALIBABA = 5;
  PROVIDER_DIGITALOCEAN = 6;
  PROVIDER_ORACLE = 7;
}

// Cluster represents the top-level Kubernetes cluster
message Cluster {
  // Identification
  // User-configured cluster identifier, defaults to kube-system namespace UID
  // The kube-system namespace UID is unique per cluster and stable across its lifetime
  string ID = 1;

  // Properties
  Provider provider = 2;
  string account = 3;
  string name = 4;

  // Centralized window definition for entire cluster
  // All resources inherit this window unless they specify their own duration
  model.Window window = 5;

  // Resources within the cluster
  repeated kubemodel.Container containers = 6;
  repeated kubemodel.Controller controllers = 7;
  repeated kubemodel.GPUDevice gpu_devices = 9;
  repeated kubemodel.GPUUsage gpu_usage = 10;
  repeated kubemodel.Namespace namespaces = 11;
  repeated kubemodel.Service services = 12;
  repeated kubemodel.Node nodes = 13;
  repeated kubemodel.Pod pods = 14;
  repeated kubemodel.Volume volumes = 15;
  repeated kubemodel.PersistentVolumeClaim persistent_volume_claims = 16;
}